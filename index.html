<!DOCTYPE html>
<html>
<head>
  <title>Jet Lag Battle for Boston</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body { margin:0; }
    #map { height:100vh; width:100vw; }

    /* Top title */
    #title {
      position:absolute;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      z-index:1000;
      font-family:sans-serif;
      font-size:18px;
      font-weight:bold;
      background: rgba(255,255,255,0.8);
      padding: 8px 16px;
    }

    /* Controls container */
    #controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display:flex;
      gap:15px;
      align-items:center;
      background: white;
      padding:10px;
      z-index:1000;
    }

    /* Color Buttons */
    #colorPicker button {
      padding:8px 14px;
      border:none;
      font-weight:bold;
      cursor:pointer;
      box-shadow:0 2px 5px rgba(0,0,0,0.2);
      transition: transform 0.1s, box-shadow 0.1s;
      color:white;
      -webkit-text-stroke: 2px black;
    }
    #colorPicker button:hover {
      transform: translateY(-2px);
      box-shadow:0 4px 8px rgba(0,0,0,0.3);
    }
    button[data-color="red"] { background-color:red; }
    button[data-color="green"] { background-color:green; }
    button[data-color="yellow"] { background-color:yellow; color:#000; }

    /* Active Color Indicator */
    #activeColor {
      width:24px;
      height:24px;
      border-radius:50%;
      border:2px solid #333;
      background-color:black;
      transition: transform 0.2s;
    }

    /* Scoreboard */
    #scoreboard {
      position:absolute;
      top:20px;
      right:20px;
      background: rgba(255,255,255,0.8);
      padding:20px;
      max-width:250px;
      font-family:sans-serif;
      font-size:24px;
      z-index:1000;
    }

    /* Tooltip user */
    .tooltip-user {
      display:flex;
      align-items:center;
    }
    .tooltip-user img {
      width:32px;
      height:32px;
      border-radius:50%;
      margin-right:8px;
    }

    /* Reset button */
    #resetBtn {
      padding:8px 12px;
      border:none;
      background-color:#34495e;
      color:white;
      font-weight:bold;
      cursor:pointer;
      box-shadow:0 2px 5px rgba(0,0,0,0.2);
      display:none;
    }
    #resetBtn:hover {
      transform: translateY(-2px);
      box-shadow:0 4px 8px rgba(0,0,0,0.3);
    }

    /* Sign-out button */
    #signOutBtn {
      position:absolute;
      bottom:20px;
      right:20px;
      padding:8px 12px;
      border:none;
      background:white;
      color:black;
      font-weight:bold;
      cursor:pointer;
      z-index:1000;
      display:none;
    }
    #signOutBtn:hover {
      transform: translateY(-2px);
      box-shadow:0 4px 8px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

<div id="map"></div>
<div id="title">Battle for Boston</div>

<div id="controls">
  <button id="loginBtn">Sign in with Google</button>
  <div id="colorPicker" style="display:flex; gap:10px;">
    <button data-color="red">Red</button>
    <button data-color="green">Green</button>
    <button data-color="yellow">Yellow</button>
    <div id="activeColor"></div>
  </div>
  <button id="resetBtn">Reset Map</button>
</div>

<div id="scoreboard"><strong>Scoreboard</strong><br></div>
<button id="signOutBtn">Sign Out</button>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// ===== Firebase Config =====
const firebaseConfig = {
  apiKey: "AIzaSyAv9PMEqDgXaqpuHzAgjJDPthwYFZaxaRg",
  authDomain: "battle-for-boston.firebaseapp.com",
  projectId: "battle-for-boston",
  storageBucket: "battle-for-boston.firebasestorage.app",
  messagingSenderId: "77626799415",
  appId: "1:77626799415:web:29e0824275af1ccca616b2",
  measurementId: "G-Z9SVFKC4B2"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth();
const provider = new GoogleAuthProvider();

// ===== Whitelist =====
const WHITELIST = [
  "blatherstv@gmail.com",
  "ethanby2000@gmail.com",
  "player2@gmail.com",
  "player3@gmail.com",
  "player4@gmail.com",
  "player5@gmail.com"
];

// ===== State =====
let currentUser = null;
let selectedColor = "red";
let selected = {};
let geojsonLayer = null;

// ===== Auth =====
onAuthStateChanged(auth, user => {
  if(user){
    if(!WHITELIST.includes(user.email)){
      alert("You do not have access to edit the map, but you can still spectate! Request permission from Blathers");
      auth.signOut();
      return;
    }
    currentUser = user;
  } else {
    currentUser = null;
  }
  updateUI();
});

// Sign-In
document.getElementById("loginBtn").onclick = () => signInWithPopup(auth, provider).catch(console.error);

// Sign-Out
document.getElementById("signOutBtn").onclick = () => auth.signOut();

// ===== UI =====
const colorButtons = document.querySelectorAll("#colorPicker button[data-color]");
const activeColorCircle = document.getElementById("activeColor");
colorButtons.forEach(btn => {
  btn.onclick = () => {
    selectedColor = btn.dataset.color;
    activeColorCircle.style.backgroundColor = selectedColor;
    activeColorCircle.style.transform = "scale(1.3)";
    setTimeout(()=>activeColorCircle.style.transform="scale(1)",200);
  };
});

function updateUI() {
  const signOutBtn = document.getElementById("signOutBtn");
  if(currentUser){
    document.getElementById("loginBtn").style.display="none";
    signOutBtn.style.display="block";
    document.getElementById("colorPicker").style.display="flex";
    activeColorCircle.style.backgroundColor = selectedColor;
    document.getElementById("resetBtn").style.display = currentUser.email==="blatherstv@gmail.com" ? "block" : "none";
  } else {
    document.getElementById("loginBtn").style.display="block";
    signOutBtn.style.display="none";
    document.getElementById("colorPicker").style.display="none";
    document.getElementById("resetBtn").style.display="none";
  }
}

// ===== Map =====
const map = L.map('map').setView([42.3601, -71.0589], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);

// ===== Firestore Real-Time =====
onSnapshot(doc(db,"mapState","boston"), docSnap=>{
  if(docSnap.exists()){
    selected = docSnap.data();
    updateStyles();
    updateScoreboard();
  }
});

// ===== Click / Double-Click =====
async function toggle(id){
  if(!currentUser){ alert("Sign in first!"); return; }
  selected[id]={
    color:selectedColor,
    userName:currentUser.displayName,
    userId:currentUser.uid,
    photoURL:currentUser.photoURL
  };
  await setDoc(doc(db,"mapState","boston"),selected);
}
async function removeColor(id){
  const data=selected[id];
  if(data && currentUser && data.userId===currentUser.uid){
    delete selected[id];
    await setDoc(doc(db,"mapState","boston"),selected);
  }
}

// Reset Button
document.getElementById("resetBtn").onclick=async()=>{ await setDoc(doc(db,"mapState","boston"),{}); }

// ===== Styles & Scoreboard =====
function updateStyles(){
  if(!geojsonLayer) return;
  geojsonLayer.eachLayer(layer=>{
    const id=layer.feature._id;
    const data=selected[id];
    layer.setStyle({
      fillColor:data?data.color:"#3388ff",
      fillOpacity:0.5,
      color:"#3388ff",
      weight:1
    });
  });
}

function updateScoreboard(){
  const scores={};
  Object.values(selected).forEach(item=>{
    if(!scores[item.userName]) scores[item.userName]=0;
    scores[item.userName]+=1;
  });
  const board=document.getElementById("scoreboard");
  board.innerHTML="<strong>Scoreboard</strong><br>"+
    Object.entries(scores)
      .sort((a,b)=>b[1]-a[1])
      .map(([name,pts])=>`${name}: ${pts}`)
      .join("<br>");
}

// ===== Feature Behavior =====
function onEachFeature(feature,layer){
  const id=feature._id;
  layer.setStyle({fillColor:"#3388ff",fillOpacity:0.5,color:"#3388ff",weight:1});

  layer.on('mouseover',()=>{
    layer.setStyle({color:"white",weight:2});
    const data=selected[id];
    if(data){
      layer.bindTooltip(`<div class="tooltip-user">
        <img src="${data.photoURL}" />
        ${data.userName}
      </div>`,{permanent:false,direction:"top"}).openTooltip();
    }
  });

  layer.on('mouseout',()=>{
    layer.setStyle({color:"#3388ff",weight:1});
    layer.closeTooltip();
    updateStyles();
  });

  layer.on('click',()=>toggle(id));
  layer.on('dblclick',()=>removeColor(id));
}

// ===== Load GeoJSON =====
fetch('Boston Subdivisions.json')
  .then(res => res.json())
  .then(data => {
    data.features.forEach((f,i)=>f._id=i.toString());
    geojsonLayer = L.geoJSON(data, { onEachFeature }).addTo(map);
    updateStyles();
    updateScoreboard();
  });
</script>
</body>
</html>
