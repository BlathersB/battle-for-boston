<!DOCTYPE html>
<html>
<head>
  <title>Boston Subdivisions</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

  <style>
    body { margin: 0; }
    #map { height: 100vh; }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">
// 🔥 Firebase
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 👉 PASTE YOUR CONFIG HERE
const firebaseConfig = {
  apiKey: "AIzaSyAv9PMEqDgXaqpuHzAgjJDPthwYFZaxaRg",
  authDomain: "battle-for-boston.firebaseapp.com",
  projectId: "battle-for-boston",
  storageBucket: "battle-for-boston.firebasestorage.app",
  messagingSenderId: "77626799415",
  appId: "1:77626799415:web:29e0824275af1ccca616b2",
  measurementId: "G-Z9SVFKC4B2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🗺️ Map
const map = L.map('map').setView([42.3601, -71.0589], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18
}).addTo(map);

let geojsonLayer;
let selected = {};

// 🔄 Real-time sync
onSnapshot(doc(db, "mapState", "boston"), (docSnap) => {
  if (docSnap.exists()) {
    selected = docSnap.data();
    updateStyles();
  }
});

// 🎨 Style updater
function updateStyles() {
  geojsonLayer.eachLayer(layer => {
    const id = layer.feature._id;

    if (selected[id]) {
      layer.setStyle({
        fillColor: "black",
        fillOpacity: 1
      });
    } else {
      layer.setStyle({
        fillColor: "#3388ff",
        fillOpacity: 0.5
      });
    }
  });
}

// 🖱️ Click handler
async function toggle(id) {
  selected[id] = !selected[id];
  await setDoc(doc(db, "mapState", "boston"), selected);
}

// 📍 Feature behavior
function onEachFeature(feature, layer) {

  const id = feature._id;

  layer.setStyle({
    color: "#3388ff",
    weight: 1,
    fillColor: "#3388ff",
    fillOpacity: 0.5
  });

  layer.on('mouseover', () => {
    layer.setStyle({
      color: "white",
      weight: 2
    });
  });

  layer.on('mouseout', () => {
    layer.setStyle({
      color: "#3388ff",
      weight: 1
    });
    updateStyles();
  });

  layer.on('click', () => {
    toggle(id);
  });
}

// 📦 Load GeoJSON
fetch('Boston Subdivisions.json')
  .then(res => res.json())
  .then(data => {

    // ✅ Assign IDs based on index
    data.features.forEach((f, i) => {
      f._id = i.toString();
    });

    geojsonLayer = L.geoJSON(data, {
      onEachFeature: onEachFeature
    }).addTo(map);

    updateStyles();
  });

</script>

</body>
</html>
