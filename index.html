<!DOCTYPE html>
<html>
<head>
  <title>Jet Lag Battle for Boston</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body { margin:0; }
    #map { height:100vh; width:100vw; }

    /* Top title */
    #title {
      position:absolute;
      top:10px;
      left:50%;
      transform:translateX(-50%);
      z-index:1000;
      font-family:sans-serif;
      font-size:18px;
      font-weight:bold;
      background: rgba(255,255,255,0.8);
      padding: 8px 16px;
    }

    /* Controls container */
    #controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      display:flex;
      gap:15px;
      align-items:center;
      background: white;
      padding:10px;
      z-index:1000;
    }

    /* Color Buttons */
    #colorPicker button {
      padding:8px 14px;
      border:none;
      font-weight:bold;
      cursor:pointer;
      box-shadow:0 2px 5px rgba(0,0,0,0.2);
      transition: transform 0.1s, box-shadow 0.1s;
      color:white;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.65);
    }
    #colorPicker button:hover {
      transform: translateY(-2px);
      box-shadow:0 4px 8px rgba(0,0,0,0.3);
    }
    button[data-color="red"] { background-color:red; }
    button[data-color="green"] { background-color:green; }
    button[data-color="yellow"] { background-color:yellow; color:#000; }
    button[data-color="black"] { background-color:gray; color:#000; }

    /* Active Color Indicator */
    #activeColor {
      width:24px;
      height:24px;
      border-radius:50%;
      border:2px solid #333;
      background-color:black;
      transition: transform 0.2s;
    }

    /* Scoreboard */
    #scoreboard {
      position:absolute;
      top:20px;
      right:20px;
      background: rgba(255,255,255,0.8);
      padding:20px;
      max-width:250px;
      font-family:sans-serif;
      font-size:24px;
      z-index:1000;
    }

    /* Tooltip user */
    .tooltip-user {
      display:flex;
      align-items:center;
    }
    .tooltip-user img {
      width:32px;
      height:32px;
      border-radius:50%;
      margin-right:8px;
    }

    /* Reset button */
    #resetBtn {
      padding:8px 12px;
      border:none;
      background-color:#34495e;
      color:white;
      font-weight:bold;
      cursor:pointer;
      box-shadow:0 2px 5px rgba(0,0,0,0.2);
      display:none;
    }
    #resetBtn:hover {
      transform: translateY(-2px);
      box-shadow:0 4px 8px rgba(0,0,0,0.3);
    }

    /* Sign-out button */
    #signOutBtn {
      position:absolute;
      bottom:20px;
      right:20px;
      padding:8px 12px;
      border:none;
      background:white;
      color:black;
      font-weight:bold;
      cursor:pointer;
      z-index:1000;
      display:none;
    }
    #signOutBtn:hover {
      transform: translateY(-2px);
      box-shadow:0 4px 8px rgba(0,0,0,0.3);
    }

    /* Style for the Lock Icon */
    .lock-icon-container {
      background: none;
      border: none;
    }
    
    .lock-icon-svg {
      filter: drop-shadow(1px 1px 1px rgba(0,0,0,0.5));
      pointer-events: none; /* Clicks pass through to the subdivision */
    }

    /* Card Drawer Styles */
    #drawer-tab {
        position: fixed;
        left: 0;
        top: 50%;
        transform: translateY(-50%);
        width: 30px;
        height: 80px;
        background: #34495e;
        color: white;
        writing-mode: vertical-rl;
        text-align: center;
        line-height: 30px;
        cursor: pointer;
        z-index: 1001;
        border-radius: 0 8px 8px 0;
        font-family: sans-serif;
        font-weight: bold;
    }
    
    #card-drawer {
        position: fixed;
        left: -450px; /* Hidden by default */
        top: 0;
        width: 450px;
        height: 100vh;
        background: white;
        box-shadow: 2px 0 10px rgba(0,0,0,0.3);
        z-index: 1002;
        transition: left 0.3s ease;
        padding: 20px;
        display: flex;
        flex-direction: column;
        font-family: sans-serif;
    }
    
    #card-drawer.open { left: 0; }
    
    #deck-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 20px;
    }
    
    .card-slot {
        width: 130px;
        height: 180px;
        border: 2px dashed #ccc;
        border-radius: 8px;
        background: rgba(0,0,0,0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 5px;
        font-size: 12px;
        cursor: pointer;
        transition: transform 0.2s, opacity 0.2s;
        opacity: 0.3; /* Default opacity for empty slots */
    }
    
    .card-slot.occupied {
        border-style: solid;
        border-color: #34495e;
        background: white;
        opacity: 1; /* Full opacity when card exists */
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    
    .card-slot.selected {
        transform: translateY(-15px); /* Visual signal for selection */
        border-color: #e74c3c;
    }
    
    #drawer-controls {
        margin-top: auto;
        display: flex;
        gap: 10px;
        padding-bottom: 20px;
    }
    
    #drawer-controls button {
        flex: 1;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }
    
    #drawBtn { background: #2ecc71; color: white; }
    #discardBtn { background: #e74c3c; color: white; }
  </style>
</head>
<body>

<div id="map"></div>
<div id="title">Battle for Boston</div>

<div id="controls">
  <button id="loginBtn">Sign in with Google</button>
  <div id="colorPicker" style="display:flex; gap:10px;">
    <button data-color="red">Red</button>
    <button data-color="green">Green</button>
    <button data-color="yellow">Yellow</button>
    <button data-color="black">Lock</button>
    <div id="activeColor"></div>
  </div>
  <button id="resetBtn">Reset Map</button>
</div>

<div id="scoreboard"><strong>Scoreboard</strong></div>
<div id="drawer-tab" onclick="toggleDrawer()">DECK</div>
<div id="card-drawer">
    <h3>Your Hand</h3>
    <div id="deck-container">
        </div>
    <div id="drawer-controls">
        <button id="drawBtn">Draw Card</button>
        <button id="discardBtn">Discard Selected</button>
    </div>
</div>
<button id="signOutBtn">Sign Out</button>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// ===== Firebase Config (Keep yours here) =====
const firebaseConfig = {
  apiKey: "AIzaSyAv9PMEqDgXaqpuHzAgjJDPthwYFZaxaRg",
  authDomain: "battle-for-boston.firebaseapp.com",
  projectId: "battle-for-boston",
  storageBucket: "battle-for-boston.firebasestorage.app",
  messagingSenderId: "77626799415",
  appId: "1:77626799415:web:29e0824275af1ccca616b2",
  measurementId: "G-Z9SVFKC4B2"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth();
const provider = new GoogleAuthProvider();

const WHITELIST = ["blatherstv@gmail.com", "ethanby2000@gmail.com", "kishore0299@gmail.com"];

// ===== State =====
let currentUser = null;
let selectedColor = "red";
let selected = {};
let geojsonLayer = null;
let lockMarkers = L.layerGroup(); // Group to manage icons easily

// ===== Auth Logic =====
onAuthStateChanged(auth, user => {
  if(user && WHITELIST.includes(user.email)){
    currentUser = user;
    setupDeckSync(user); // <--- Add this line here
  } else {
    currentUser = null;
    setupDeckSync(null); // <--- Add this line here
    if(user) auth.signOut();
  }
  updateUI();
});

document.getElementById("loginBtn").onclick = () => signInWithPopup(auth, provider);
document.getElementById("signOutBtn").onclick = () => auth.signOut();

// ===== UI Logic =====
const colorButtons = document.querySelectorAll("#colorPicker button[data-color]");
const activeColorCircle = document.getElementById("activeColor");

colorButtons.forEach(btn => {
  btn.onclick = () => {
    selectedColor = btn.dataset.color;
    activeColorCircle.style.backgroundColor = selectedColor === "black" ? "black" : selectedColor;
  };
});

function updateUI() {
  const isAuth = !!currentUser;
  document.getElementById("loginBtn").style.display = isAuth ? "none" : "block";
  document.getElementById("signOutBtn").style.display = isAuth ? "block" : "none";
  document.getElementById("colorPicker").style.display = isAuth ? "flex" : "none";
  document.getElementById("resetBtn").style.display = (currentUser?.email === "blatherstv@gmail.com") ? "block" : "none";
}

// ===== Map Setup =====
const map = L.map('map').setView([42.3601, -71.0589], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
lockMarkers.addTo(map); // Add the icon layer to map

// ===== SVG Icon Definition =====
const lockIcon = L.divIcon({
  html: `<svg class="lock-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="black"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>`,
  className: 'lock-icon-container',
  iconSize: [18, 18],
  iconAnchor: [9, 9]
});

// ===== Core Logic =====
async function toggle(id) {
  if (!currentUser) return;
  
  const currentData = selected[id] || {};

  if (selectedColor === "black") {
    // Toggle the Lock status on/off without changing the owner
    if (currentData.color) {
      currentData.isLocked = !currentData.isLocked;
    } else {
      alert("Claim it first before locking!");
      return;
    }
  } else {
    // Normal Claiming Logic
    selected[id] = {
      color: selectedColor,
      userName: currentUser.displayName,
      userId: currentUser.uid,
      photoURL: currentUser.photoURL,
      isLocked: false // Reset lock when someone else takes it
    };
  }
  
  await setDoc(doc(db, "mapState", "boston"), selected);
}

async function removeColor(id) {
  if (selected[id]?.userId === currentUser?.uid) {
    delete selected[id];
    await setDoc(doc(db, "mapState", "boston"), selected);
  }
}

// ===== Real-time Sync =====
onSnapshot(doc(db, "mapState", "boston"), docSnap => {
  if (docSnap.exists()) {
    selected = docSnap.data();
    updateStyles();
    updateScoreboard();
  }
});

function updateStyles() {
  if (!geojsonLayer) return;
  lockMarkers.clearLayers(); // Clear old icons

  geojsonLayer.eachLayer(layer => {
    const id = layer.feature._id;
    const data = selected[id];

    layer.setStyle({
      fillColor: data ? data.color : "#3388ff",
      fillOpacity: 0.33,
      color: "#ffffff",
      weight: 1
    });

    if (data?.isLocked) {
      const center = layer.getBounds().getCenter();
      L.marker(center, { icon: lockIcon, interactive: false }).addTo(lockMarkers);
    }
  });
}

function updateScoreboard() {
  const scores = {};
  Object.values(selected).forEach(item => {
    scores[item.userName] = (scores[item.userName] || 0) + 1;
  });
  document.getElementById("scoreboard").innerHTML = "<strong>Scoreboard</strong><br><br>" +
    Object.entries(scores).sort((a,b)=>b[1]-a[1]).map(([n,p])=>`${n}: ${p}`).join("<br>");
}

function onEachFeature(feature, layer) {
  const id = feature._id;
  layer.on({
    mouseover: () => {
      layer.setStyle({ color: "#00fffb", weight: 3 });
      const data = selected[id];
      let content = `<strong>${feature.properties.name || 'Subdivision'}</strong>`;
      if (data) content += `<div class="tooltip-user"><img src="${data.photoURL}"/>${data.userName} ${data.isLocked ? '(LOCKED)' : ''}</div>`;
      layer.bindTooltip(content).openTooltip();
    },
    mouseout: () => { 
      layer.closeTooltip(); 
      updateStyles(); 
    },
    click: () => toggle(id),
    dblclick: () => removeColor(id)
  });
}

// ===== Challenge/Deck State =====
let challenges = [];
let userHand = []; 
let selectedSlotIndex = null;

// 1. Fetch the Challenges JSON
fetch('challenges.json')
    .then(res => res.json())
    .then(data => {
        challenges = data;
        console.log("Challenges loaded:", challenges.length);
    })
    .catch(err => console.error("Error loading challenges.json:", err));

// 2. Module-safe Drawer Toggle (Attaches to 'window' so HTML can see it)
window.toggleDrawer = () => {
    const drawer = document.getElementById('card-drawer');
    drawer.classList.toggle('open');
};

// 3. Render the Hand to the UI
function renderHand() {
    const deckContainer = document.getElementById('deck-container');
    if (!deckContainer) return;
    
    deckContainer.innerHTML = '';
    
    for (let i = 0; i < 7; i++) {
        const slot = document.createElement('div');
        slot.className = 'card-slot';
        const card = userHand[i];

        if (card) {
            slot.classList.add('occupied');
            
            // Build the Display Info
            const stars = card.stars === 1 ? '⭐' : card.stars === 2 ? '⭐⭐' : '';
            const double = card.twoTerritories ? '<br><strong>[2X]</strong>' : '';
            
            slot.innerHTML = `<div><strong>${card.title}</strong>${double}</div>`;
            
            // Tooltip Content (Title attribute shows on hover)
            slot.title = `${card.description}\n\n${stars} ${card.twoTerritories ? '(2X Territories)' : ''}`;

            // If this specific slot is selected, add the class
            if (selectedSlotIndex === i) {
                slot.classList.add('selected');
            }

            // Click to select/unselect
            slot.onclick = () => {
                selectedSlotIndex = (selectedSlotIndex === i) ? null : i;
                renderHand();
            };
        } else {
            slot.innerHTML = 'Empty Slot';
            slot.onclick = null;
        }
        
        deckContainer.appendChild(slot);
    }
}

// 4. Draw Card Logic
document.getElementById('drawBtn').onclick = async () => {
    if (!currentUser) {
        alert("Please sign in to draw cards!");
        return;
    }
    if (userHand.length >= 7) {
        alert("Your hand is full! Discard a card to draw a new one.");
        return;
    }
    if (challenges.length === 0) {
        alert("Challenges are still loading...");
        return;
    }

    const randomCard = challenges[Math.floor(Math.random() * challenges.length)];
    userHand.push(randomCard);
    await saveHandToFirebase();
};

// 5. Discard Card Logic
document.getElementById('discardBtn').onclick = async () => {
    if (selectedSlotIndex === null) {
        alert("Tap a card in your hand first to select it for discarding.");
        return;
    }
    
    // Remove the selected card from the array
    userHand.splice(selectedSlotIndex, 1);
    selectedSlotIndex = null; // Clear selection
    await saveHandToFirebase();
};

// 6. Persistence: Save to Firestore
async function saveHandToFirebase() {
    if (currentUser) {
        try {
            await setDoc(doc(db, "userDecks", currentUser.uid), { 
                hand: userHand,
                lastUpdated: new Date()
            });
        } catch (e) {
            console.error("Error saving deck: ", e);
        }
    }
    renderHand();
}

// 7. Integration: Add this to your existing onAuthStateChanged!
// (I'm providing the logic here - ensure it's called inside your auth observer)
function setupDeckSync(user) {
    if (user) {
        onSnapshot(doc(db, "userDecks", user.uid), (docSnap) => {
            if (docSnap.exists()) {
                userHand = docSnap.data().hand || [];
            } else {
                userHand = [];
            }
            renderHand();
        });
    } else {
        userHand = [];
        renderHand();
    }
}

// ===== Initial Load =====
fetch('Boston Subdivisions.json')
  .then(res => res.json())
  .then(data => {
    data.features.forEach((f, i) => f._id = i.toString());
    geojsonLayer = L.geoJSON(data, { onEachFeature }).addTo(map);
    updateStyles();
  });

document.getElementById("resetBtn").onclick = async () => await setDoc(doc(db, "mapState", "boston"), {});
</script>
</body>
</html>
