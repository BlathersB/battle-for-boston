<!DOCTYPE html>
<html>
<head>
  <title>Boston Subdivisions Collaborative Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body { margin: 0; }
    #map { height: 100vh; }

    /* Controls */
    #controls {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      z-index: 1000;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* Color Buttons */
    #colorPicker button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #colorPicker button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    button[data-color="red"] { background-color: #e74c3c; }
    button[data-color="green"] { background-color: #27ae60; }
    button[data-color="yellow"] { background-color: #f1c40f; color:#000; }

    /* Scoreboard */
    #scoreboard {
      position: absolute;
      top: 20px;
      right: 20px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      max-width: 200px;
      font-family: sans-serif;
      font-size: 14px;
      z-index: 1000;
    }

    /* Tooltip images */
    .tooltip-user {
      display: flex;
      align-items: center;
    }
    .tooltip-user img {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      margin-right: 5px;
    }
  </style>
</head>
<body>

<div id="map"></div>

<div id="controls">
  <button id="loginBtn">Sign in with Google</button>
  <div id="colorPicker" style="display:none;">
    <button data-color="red">Red</button>
    <button data-color="green">Green</button>
    <button data-color="yellow">Yellow</button>
  </div>
</div>

<div id="scoreboard"><strong>Scoreboard</strong></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// ====== Firebase Config ======
const firebaseConfig = {
  apiKey: "AIzaSyAv9PMEqDgXaqpuHzAgjJDPthwYFZaxaRg",
  authDomain: "battle-for-boston.firebaseapp.com",
  projectId: "battle-for-boston",
  storageBucket: "battle-for-boston.firebasestorage.app",
  messagingSenderId: "77626799415",
  appId: "1:77626799415:web:29e0824275af1ccca616b2",
  measurementId: "G-Z9SVFKC4B2"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth();
const provider = new GoogleAuthProvider();

// ====== State ======
let currentUser = null;
let selectedColor = "red";
let selected = {};
let geojsonLayer = null;

// ====== Auth ======
onAuthStateChanged(auth, (user) => {
  currentUser = user;
  updateUI();
});

async function signIn() {
  await signInWithPopup(auth, provider);
}

// ====== UI ======
document.getElementById("loginBtn").onclick = signIn;
document.querySelectorAll("#colorPicker button").forEach(btn => {
  btn.onclick = () => { selectedColor = btn.dataset.color; }
});

function updateUI() {
  if (currentUser) {
    document.getElementById("loginBtn").style.display = "none";
    document.getElementById("colorPicker").style.display = "flex";
  }
}

// ====== Map Setup ======
const map = L.map('map').setView([42.3601, -71.0589], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

// ====== Firestore Real-Time ======
onSnapshot(doc(db, "mapState", "boston"), (docSnap) => {
  if (docSnap.exists()) {
    selected = docSnap.data();
    updateStyles();
    updateScoreboard();
  }
});

// ====== Click / Double Click Handlers ======
async function toggle(id) {
  if (!currentUser) { alert("You must sign in first"); return; }

  selected[id] = {
    color: selectedColor,
    userName: currentUser.displayName,
    userId: currentUser.uid,
    photoURL: currentUser.photoURL
  };
  await setDoc(doc(db, "mapState", "boston"), selected);
}

async function removeColor(id) {
  if (!currentUser) return;
  const data = selected[id];
  if (data && data.userId === currentUser.uid) {
    delete selected[id];
    await setDoc(doc(db, "mapState", "boston"), selected);
  }
}

// ====== Update Styles ======
function updateStyles() {
  if (!geojsonLayer) return;
  geojsonLayer.eachLayer(layer => {
    const id = layer.feature._id;
    const data = selected[id];
    if (data) {
      layer.setStyle({ fillColor: data.color, fillOpacity: 1 });
    } else {
      layer.setStyle({ fillColor: "#3388ff", fillOpacity: 0.5 });
    }
  });
}

// ====== Update Scoreboard ======
function updateScoreboard() {
  const scores = {};
  Object.values(selected).forEach(item => {
    if (!scores[item.userName]) scores[item.userName] = 0;
    scores[item.userName] += 1;
  });
  const board = document.getElementById("scoreboard");
  board.innerHTML = "<strong>Scoreboard</strong><br>" +
    Object.entries(scores)
      .sort((a,b)=>b[1]-a[1])
      .map(([name, pts]) => `${name}: ${pts}`)
      .join("<br>");
}

// ====== Feature Behavior ======
function onEachFeature(feature, layer) {
  const id = feature._id;
  layer.setStyle({ color:"#3388ff", weight:1, fillColor:"#3388ff", fillOpacity:0.5 });

  layer.on('mouseover', () => {
    layer.setStyle({ color:"white", weight:2 });
    const data = selected[id];
    if (data) {
      layer.bindTooltip(`
        <div class="tooltip-user">
          <img src="${data.photoURL}" />
          ${data.userName}
        </div>
      `, { permanent:false, direction:"top" }).openTooltip();
    }
  });

  layer.on('mouseout', () => {
    layer.setStyle({ color:"#3388ff", weight:1 });
    layer.closeTooltip();
    updateStyles();
  });

  layer.on('click', () => toggle(id));
  layer.on('dblclick', () => removeColor(id));
}

// ====== Load GeoJSON ======
fetch('Boston Subdivisions.json')
  .then(res => res.json())
  .then(data => {
    data.features.forEach((f,i)=>f._id = i.toString());
    geojsonLayer = L.geoJSON(data, { onEachFeature }).addTo(map);
    updateStyles();
    updateScoreboard();
  });
</script>
</body>
</html>
